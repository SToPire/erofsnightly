name: mt_smoking

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

jobs:
  qemu-panic-exit-test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check qemu panic exit fix is present
        run: |
          grep -q -- '-no-reboot' qemu-kbuild-test
          grep -q -- 'panic=1' qemu-kbuild-test
      - name: Download problematic bzImage
        uses: actions/download-artifact@v4
        with:
          name: erofs-bzImage
          repository: SToPire/erofsnightly
          run-id: 26653940319
          github-token: ${{ github.token }}
      - name: Boot panic image and verify qemu exits
        run: |
          sudo apt update -y
          sudo apt install -y qemu-kvm

          set +e
          timeout 60s qemu-system-x86_64 \
            -nographic -serial mon:stdio -m 512M -smp 2 \
            --accel tcg,thread=multi -no-reboot -kernel bzImage \
            -net nic,model=e1000 -net user \
            -append 'console=ttyS0 panic=1 root=/dev/ram0' 2>&1 | tee qemu.log
          qemu_rc=${PIPESTATUS[0]}
          set -e

          echo "qemu_rc=${qemu_rc}"
          if [ "${qemu_rc}" -eq 124 ]; then
            echo "::error::QEMU timed out instead of exiting after guest panic"
            exit 124
          fi

          grep -q 'Kernel panic - not syncing' qemu.log
          grep -q 'Rebooting in 1 seconds' qemu.log

          echo "::error::Guest panic was observed and QEMU exited; failing intentionally so the workflow conclusion is failure, not timeout"
          exit 1
